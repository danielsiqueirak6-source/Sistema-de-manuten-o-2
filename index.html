<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Chamados de Manutenção</title>
</head>
<body>
    <h1>Sistema de Chamados de Manutenção Industrial</h1>
    <h2> Abrir Chamado</h2>
    <from id="fromChamado"
        <label >Equipamento</label><br>
        <input type="text" id="equipamento" required><br> <br>
        <label>Problema</label> <br>
        <input type="text" id="problema" required> <br><br>
        <label>Descrição</label><br>
        <input type="text" id="descricao" required> <br><br>
        <label>Prioridade</label><br>
        <input type="text" id="prioridade" required> <br><br>    
        <button type="submit">Cadastrar Chamado</button>
</from>        
        


    <div id="lista">Carregando Chamados...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>


</body>
</html>
